# ============================================================
# MARVELOUS HOTEL — Multi-Server / Multi-Port Apache Configuration
# File: apache-vhosts-setup.conf
# ============================================================
# Paano ito i-apply sa XAMPP Linux o Windows:
# 1. Buksan ang /opt/lampp/etc/httpd.conf (o C:\xampp\apache\conf\httpd.conf)
# 2. Siguraduhin na naka-enable ang VirtualHosts:
#    Include etc/extra/httpd-vhosts.conf
# 3. Kopyahin ang nilalaman nito sa /opt/lampp/etc/extra/httpd-vhosts.conf
# 4. I-restart ang Apache:
#    Linux: sudo /opt/lampp/lampp restartapache
#    Windows: I-restart ang Apache sa XAMPP Control Panel
# ============================================================

# ------------------------------------------------------------
# 1. MULTI-PORT SETUP (Magkahiwalay na Port sa Bawat Server)
# ------------------------------------------------------------
Listen 8080
Listen 8081
Listen 8082

# SERVER 1: USER / PUBLIC GUEST SERVER (Port 8080)
# Dito nagbu-book ang user, nagre-register, nagla-login, at nakikipag-chat sa AI.
<VirtualHost *:8080>
    ServerName hotel.local
    DocumentRoot "/opt/lampp/htdocs/hotel"
    SetEnv MH_PORTAL "user"

    <Directory "/opt/lampp/htdocs/hotel">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "/opt/lampp/htdocs/hotel/logs/user-error.log"
    CustomLog "/opt/lampp/htdocs/hotel/logs/user-access.log" combined
</VirtualHost>

# SERVER 2: SUPER ADMIN SERVER (Port 8081)
# Dito may buong hawak ang Admin sa accounts, passwords, rooms, payments, at settings.
<VirtualHost *:8081>
    ServerName admin.hotel.local
    DocumentRoot "/opt/lampp/htdocs/hotel/frontend/admin"
    SetEnv MH_PORTAL "admin"

    <Directory "/opt/lampp/htdocs/hotel/frontend/admin">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Access sa shared frontend assets, backend API/AI/endpoints, at uploads
    Alias /frontend/assets "/opt/lampp/htdocs/hotel/frontend/assets"
    Alias /assets "/opt/lampp/htdocs/hotel/frontend/assets"
    Alias /uploads "/opt/lampp/htdocs/hotel/uploads"
    Alias /backend/api "/opt/lampp/htdocs/hotel/backend/api"
    Alias /backend/ai "/opt/lampp/htdocs/hotel/backend/ai"
    Alias /ai "/opt/lampp/htdocs/hotel/backend/ai"
    Alias /serve-file.php "/opt/lampp/htdocs/hotel/backend/endpoints/serve-file.php"
    Alias /auth/logout.php "/opt/lampp/htdocs/hotel/backend/endpoints/logout.php"
    Alias /auth "/opt/lampp/htdocs/hotel/frontend/auth"
    <Directory "/opt/lampp/htdocs/hotel/frontend/assets">
        Require all granted
    </Directory>
    <Directory "/opt/lampp/htdocs/hotel/uploads">
        Require all granted
    </Directory>
    <Directory "/opt/lampp/htdocs/hotel/backend/api">
        AllowOverride All
        Require all granted
    </Directory>
    <Directory "/opt/lampp/htdocs/hotel/backend/ai">
        Require all granted
    </Directory>
    <Directory "/opt/lampp/htdocs/hotel/backend/endpoints">
        Require all granted
    </Directory>
    <Directory "/opt/lampp/htdocs/hotel/frontend/auth">
        Require all granted
    </Directory>

    ErrorLog "/opt/lampp/htdocs/hotel/logs/admin-error.log"
    CustomLog "/opt/lampp/htdocs/hotel/logs/admin-access.log" combined
</VirtualHost>

# SERVER 3: STAFF / FRONTDESK SERVER (Port 8082)
# Dito nag-aasikaso ang Staff sa check-in, check-out, at room status lamang.
<VirtualHost *:8082>
    ServerName staff.hotel.local
    DocumentRoot "/opt/lampp/htdocs/hotel/frontend/staff"
    SetEnv MH_PORTAL "staff"

    <Directory "/opt/lampp/htdocs/hotel/frontend/staff">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Access sa shared frontend assets, backend API/AI/endpoints, at uploads
    Alias /frontend/assets "/opt/lampp/htdocs/hotel/frontend/assets"
    Alias /assets "/opt/lampp/htdocs/hotel/frontend/assets"
    Alias /uploads "/opt/lampp/htdocs/hotel/uploads"
    Alias /backend/api "/opt/lampp/htdocs/hotel/backend/api"
    Alias /backend/ai "/opt/lampp/htdocs/hotel/backend/ai"
    Alias /ai "/opt/lampp/htdocs/hotel/backend/ai"
    Alias /serve-file.php "/opt/lampp/htdocs/hotel/backend/endpoints/serve-file.php"
    Alias /auth/logout.php "/opt/lampp/htdocs/hotel/backend/endpoints/logout.php"
    Alias /auth "/opt/lampp/htdocs/hotel/frontend/auth"
    <Directory "/opt/lampp/htdocs/hotel/frontend/assets">
        Require all granted
    </Directory>
    <Directory "/opt/lampp/htdocs/hotel/uploads">
        Require all granted
    </Directory>
    <Directory "/opt/lampp/htdocs/hotel/backend/api">
        AllowOverride All
        Require all granted
    </Directory>
    <Directory "/opt/lampp/htdocs/hotel/backend/ai">
        Require all granted
    </Directory>
    <Directory "/opt/lampp/htdocs/hotel/backend/endpoints">
        Require all granted
    </Directory>
    <Directory "/opt/lampp/htdocs/hotel/frontend/auth">
        Require all granted
    </Directory>

    ErrorLog "/opt/lampp/htdocs/hotel/logs/staff-error.log"
    CustomLog "/opt/lampp/htdocs/hotel/logs/staff-access.log" combined
</VirtualHost>

# ------------------------------------------------------------
# 2. DOMAIN / VIRTUAL HOST SETUP (Kung nais gamitin sa Port 80)
# ------------------------------------------------------------
# I-map sa /etc/hosts (Linux) o C:\Windows\System32\drivers\etc\hosts:
# 127.0.0.1 hotel.local
# 127.0.0.1 admin.hotel.local
# 127.0.0.1 staff.hotel.local
# ------------------------------------------------------------
<VirtualHost *:80>
    ServerName hotel.local
    ServerAlias www.hotel.local
    DocumentRoot "/opt/lampp/htdocs/hotel"
    SetEnv MH_PORTAL "user"
    <Directory "/opt/lampp/htdocs/hotel">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    ServerName admin.hotel.local
    DocumentRoot "/opt/lampp/htdocs/hotel/admin"
    SetEnv MH_PORTAL "admin"
    Alias /assets "/opt/lampp/htdocs/hotel/assets"
    Alias /uploads "/opt/lampp/htdocs/hotel/uploads"
    Alias /ai "/opt/lampp/htdocs/hotel/ai"
    Alias /serve-file.php "/opt/lampp/htdocs/hotel/serve-file.php"
    Alias /auth "/opt/lampp/htdocs/hotel/auth"
    <Directory "/opt/lampp/htdocs/hotel/admin">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    <Directory "/opt/lampp/htdocs/hotel/assets">
        Require all granted
    </Directory>
    <Directory "/opt/lampp/htdocs/hotel/uploads">
        Require all granted
    </Directory>
    <Directory "/opt/lampp/htdocs/hotel/ai">
        Require all granted
    </Directory>
    <Directory "/opt/lampp/htdocs/hotel/auth">
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    ServerName staff.hotel.local
    DocumentRoot "/opt/lampp/htdocs/hotel/staff"
    SetEnv MH_PORTAL "staff"
    Alias /assets "/opt/lampp/htdocs/hotel/assets"
    Alias /uploads "/opt/lampp/htdocs/hotel/uploads"
    Alias /ai "/opt/lampp/htdocs/hotel/ai"
    Alias /serve-file.php "/opt/lampp/htdocs/hotel/serve-file.php"
    Alias /auth "/opt/lampp/htdocs/hotel/auth"
    <Directory "/opt/lampp/htdocs/hotel/staff">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    <Directory "/opt/lampp/htdocs/hotel/assets">
        Require all granted
    </Directory>
    <Directory "/opt/lampp/htdocs/hotel/uploads">
        Require all granted
    </Directory>
    <Directory "/opt/lampp/htdocs/hotel/ai">
        Require all granted
    </Directory>
    <Directory "/opt/lampp/htdocs/hotel/auth">
        Require all granted
    </Directory>
</VirtualHost>
