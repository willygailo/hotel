# ============================================================
# MARVELOUS HOTEL & DORMITORY — MULTI-SERVER VIRTUAL HOST CONFIG
# Apache VirtualHost Configuration for Independent Port Servers
# ============================================================
# I-paste o i-include ito sa iyong C:/xampp/apache/conf/extra/httpd-vhosts.conf

# 1. Makinig sa iba't ibang ports
Listen 8080
Listen 8081
Listen 8082

# ============================================================
# SERVER 1: USER / GUEST PUBLIC SERVER (PORT 8080 o DEFAULT 80)
# Para sa mga bisita, pagpaparehistro, pag-book, at AI chatbot
# ============================================================
<VirtualHost *:8080>
    ServerName user.marveloushotel.local
    DocumentRoot "C:/xampp/htdocs/website Hotel"
    
    <Directory "C:/xampp/htdocs/website Hotel">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    # Harangin ang staff at admin direct URL kung nasa user server port
    # DirectoryIndex index.php
</VirtualHost>

# ============================================================
# SERVER 2: STAFF FRONTDESK SERVER (PORT 8081)
# Para lamang sa mga Frontdesk staff (Check-in, Check-out, Accept/Decline)
# ============================================================
<VirtualHost *:8081>
    ServerName staff.marveloushotel.local
    DocumentRoot "C:/xampp/htdocs/hotel/frontend/staff"
    DirectoryIndex login.php dashboard.php
    
    <Directory "C:/xampp/htdocs/hotel/frontend/staff">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

# ============================================================
# SERVER 3: ADMIN EXECUTIVE SERVER (PORT 8082)
# Hiwalay at saradong server para sa Super Admin lamang
# ============================================================
<VirtualHost *:8082>
    ServerName admin.marveloushotel.local
    DocumentRoot "C:/xampp/htdocs/hotel/frontend/admin"
    DirectoryIndex login.php dashboard.php
    
    <Directory "C:/xampp/htdocs/hotel/frontend/admin">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
