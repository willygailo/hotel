<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1580" viewBox="0 0 1040 1580">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9.5 5 L 0 8.8 L 2.2 5 Z" fill="#111111"/>
    </marker>
    <style>
      .boundary { fill: #FFFFFF; stroke: #111111; stroke-width: 1.6; }
      .sys-title { font-family: 'DejaVu Sans', Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 700; fill: #111111; text-anchor: middle; }
      .uc-text { font-family: 'DejaVu Sans', Arial, Helvetica, sans-serif; font-size: 13.5px; font-weight: 700; fill: #111111; text-anchor: middle; dominant-baseline: central; }
      .actor-label { font-family: 'DejaVu Sans', Arial, Helvetica, sans-serif; font-size: 14.5px; font-weight: 700; fill: #111111; text-anchor: middle; }
      .conn { fill: none; stroke: #111111; stroke-width: 1.3; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- Pure White Background -->
  <rect x="0" y="0" width="1040" height="1580" fill="#FFFFFF"/>

  <!-- System Boundary -->
  <rect class="boundary" x="295" y="24" width="450" height="1530"/>
  <text class="sys-title" x="520" y="54">Marvelous Hotel &amp; Dormitory Management System</text>
  <line x1="315" y1="68" x2="725" y2="68" stroke="#E2E8F0" stroke-width="1.2"/>

